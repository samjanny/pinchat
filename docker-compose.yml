services:
  pinchat:
    build: .
    container_name: pinchat
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./certs:/app/certs:ro
    env_file:
      - .env
    tmpfs:
      - /tmp:mode=1777,size=512M
    restart: unless-stopped
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Linux capabilities - dropped entirely.
    # The Dockerfile creates the non-root `pinchat` user (uid 1000) and chowns
    # /app at BUILD time. The runtime process never calls chown/setuid/setgid,
    # and port 3000 is >1024 so CAP_NET_BIND_SERVICE is not needed either.
    cap_drop:
      - ALL

    # Read-only root filesystem. Writable scratch is provided by the /tmp
    # tmpfs above; no other write path is needed (certs are read-only volume,
    # static files are baked into the image, logs go to stdout).
    read_only: true

# Pin the compose network so the gateway address nginx connects from is the
# same after every `docker compose down`/`up`. TRUSTED_PROXIES in .env names
# this gateway (172.18.0.1); had Docker picked another pool the server would
# silently ignore X-Forwarded-For and every visitor would share one
# rate-limit bucket.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
