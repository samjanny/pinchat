services:
  pinchat:
    build: .
    container_name: pinchat
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./certs:/app/certs:ro
    env_file:
      - .env
    tmpfs:
      - /tmp:mode=1777,size=512M
    restart: unless-stopped

    # Fixed address on the compose network below. nginx proxies to
    # 172.18.0.2:3000 directly; going through the published port means
    # docker-proxy, whose two extra sockets per connection grow their kernel
    # buffers and held most of the host's TCP memory under image traffic.
    networks:
      default:
        ipv4_address: 172.18.0.2

    # Memory ceiling with no swap on top of it. `memswap_limit` is memory plus
    # swap, so setting it equal to `mem_limit` leaves the container no swap at
    # all: pages of the relay's memory (addresses of open connections, room
    # state, ciphertext in transit) are not written to the host's swap device.
    # The /tmp tmpfs above counts against the same ceiling.
    mem_limit: 512m
    memswap_limit: 512m
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Linux capabilities - dropped entirely.
    # The Dockerfile creates the non-root `pinchat` user (uid 1000) and chowns
    # /app at BUILD time. The runtime process never calls chown/setuid/setgid,
    # and port 3000 is >1024 so CAP_NET_BIND_SERVICE is not needed either.
    cap_drop:
      - ALL

    # Read-only root filesystem. Writable scratch is provided by the /tmp
    # tmpfs above; no other write path is needed (certs are read-only volume,
    # static files are baked into the image, logs go to stdout).
    read_only: true

# Pin the compose network so the gateway address nginx connects from is the
# same after every `docker compose down`/`up`. TRUSTED_PROXIES in .env names
# this gateway (172.18.0.1); had Docker picked another pool the server would
# silently ignore X-Forwarded-For and every visitor would share one
# rate-limit bucket.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
