[package]
name = "pinchat"
version = "0.9.3"
edition = "2024"

[dependencies]
axum = "0.7"
# The WebSocket transport is the relay's own (src/ws_transport.rs), and so is
# the HTTP/1.1 listener in front of it (src/http_server.rs); these three are
# what they need from the HTTP stack, at the versions axum uses.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
sha1 = "0.10"
# Send buffer of accepted sockets, and the allocator setting made at start.
socket2 = "0.6"
libc = "0.2"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
tower_governor = "0.4"
dashmap = "5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8.6"
hmac = "0.12"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
futures-util = "0.3"
dotenvy = "0.15"
argon2 = "0.5"
subtle = "2.6"
base64 = "0.22"
axum-extra = { version = "0.9", default-features = false, features = ["cookie"] }
time = "0.3"
urlencoding = "2"

# `fuzzing` is set by cargo-fuzz for the harness in fuzz/, which compiles
# src/ws_transport.rs into its own crate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dev-dependencies]
# Enable tower's "util" feature in tests for `ServiceExt::oneshot`, used by
# integration-style tests that drive the router without a real listener.
tower = { version = "0.4", features = ["util"] }
# An independent WebSocket client: the tests talk to the relay's own
# transport through it.
tokio-tungstenite = "0.24"

[[bin]]
name = "generate_hash"
path = "src/bin/generate_hash.rs"
