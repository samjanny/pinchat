name: SRI consistency

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'hashes.json.signed'
      - 'extensions/chrome/**'
      - 'extensions/firefox/**'
      - 'extensions/generate-csp-rules.js'
      - '.github/scripts/verify-sri.js'
      - '.github/workflows/sri-check.yml'
  # The same paths as for push: a pull request that changes only this
  # workflow, or anything else the gate reads, must run it too.
  pull_request:
    paths:
      - 'static/**'
      - 'hashes.json.signed'
      - 'extensions/chrome/**'
      - 'extensions/firefox/**'
      - 'extensions/generate-csp-rules.js'
      - '.github/scripts/verify-sri.js'
      - '.github/workflows/sri-check.yml'

jobs:
  verify-sri:
    name: Verify inline SRI and signed manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify SRI
        run: node .github/scripts/verify-sri.js
