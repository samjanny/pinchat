name: Docker build

on:
  push:
    branches: [main, experimental-groups-custom]
    paths:
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'static/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'

jobs:
  build:
    name: Verify image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pinchat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint /usr/local/bin/pinchat pinchat:ci --help \
            || docker run --rm --entrypoint /bin/sh pinchat:ci -c 'test -x /usr/local/bin/pinchat'
