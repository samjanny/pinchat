name: CI

on:
  push:
    branches: [main, experimental-groups-custom]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Clippy runs as advisory (no -D warnings). The codebase predates
      # several Rust style lints introduced in 1.90+; failing the build
      # on every new lint creates churn. Review the output, but don't
      # block PRs on it until we explicitly opt in to specific lints.
      - name: cargo clippy (advisory)
        run: cargo clippy --all-targets --locked
        continue-on-error: true

      - name: cargo test
        run: cargo test --locked

  node-tests:
    name: Crypto tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Signal Protocol tests
        run: node tests/run-all-tests.js
