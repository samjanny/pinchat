<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/style.css" integrity="sha256-caH6wyoVV2hNx2Sn74/oVIDpEeyU5g038lzT/C2pnQk=" crossorigin="anonymous" >
    <script src="/static/js/theme.js" integrity="sha256-vguZcvUBFZL2wz1CcdaSVsPfryWwZGvpw9DYzS7e6h0=" crossorigin="anonymous" ></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Secure Access</h1>
            </div>

            <div id="error-container"></div>

            <form id="login-form" method="POST" action="/login">
                <input type="hidden" id="csrf_token" name="csrf_token" value="">
                <input type="hidden" id="redirect_url" name="redirect_url" value="">

                <div class="form-group">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="password-input"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                        autofocus
                    >
                </div>

                <button type="submit" class="login-btn" id="submit-btn" disabled>
                    Loading...
                </button>
            </form>

        </div>

        <footer class="login-footer">
            <a href="/static/terms.html">Terms of Service</a>
            <span class="footer-sep" aria-hidden="true">·</span>
            <a href="/static/privacy.html">Privacy Policy</a>
            <span class="footer-sep" aria-hidden="true">·</span>
            <a href="https://github.com/samjanny/pinchat" target="_blank" rel="noopener noreferrer">GitHub</a>
        </footer>
    </div>

    <script src="/static/js/login.js" integrity="sha256-OZ1in+Y/J5HSZFw2fTUVBNtT5fkGtORNMz8/1yp00Qw=" crossorigin="anonymous" ></script>
</body>
</html>
