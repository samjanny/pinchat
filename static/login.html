<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/style.css" integrity="sha256-CqFpHD5PwZxEU+XHjnatW75oK10IRxNPOg+AT4P66To=" crossorigin="anonymous" >
    <!--
        Head-loaded synchronously so the bootstrap key fragment is scrubbed
        from the URL bar before any other script (or the user) can observe
        it. See static/js/login-stash.js and finding C-03 in the audit log.
    -->
    <script src="/static/js/login-stash.js" integrity="sha256-nZVXHQyP6NFAX/uvbxioVeAql2otcUFi5bYFJtweelg=" crossorigin="anonymous" ></script>
    <script src="/static/js/theme.js" integrity="sha256-IFPp16c490XqfYw01UQmSLORmfv7DKKWOXNpQOdw2X0=" crossorigin="anonymous" ></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Secure Access</h1>
            </div>

            <div id="error-container"></div>

            <form id="login-form" method="POST" action="/login">
                <input type="hidden" id="csrf_token" name="csrf_token" value="">
                <input type="hidden" id="redirect_url" name="redirect_url" value="">

                <div class="form-group">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="password-input"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                        autofocus
                    >
                </div>

                <button type="submit" class="login-btn" id="submit-btn" disabled>
                    Loading...
                </button>
            </form>

        </div>

        <footer class="login-footer">
            <a href="/static/terms.html">Terms of Service</a>
            <span class="footer-sep" aria-hidden="true">·</span>
            <a href="/static/privacy.html">Privacy Policy</a>
            <span class="footer-sep" aria-hidden="true">·</span>
            <a href="https://github.com/samjanny/pinchat" target="_blank" rel="noopener noreferrer">GitHub</a>
        </footer>
    </div>

    <script src="/static/js/login.js" integrity="sha256-OZ1in+Y/J5HSZFw2fTUVBNtT5fkGtORNMz8/1yp00Qw=" crossorigin="anonymous" ></script>

    <!-- Cookie notice (informational, dismissible - see static/js/cookie-notice.js) -->
    <div id="cookie-notice" class="cookie-notice hidden" role="region" aria-label="Cookie notice">
        <span class="cookie-notice-text">This site uses only strictly necessary cookies (session, CSRF, and a short-lived proof-of-work cookie). No tracking, no analytics. <a href="/static/privacy.html">Privacy</a></span>
        <button type="button" class="cookie-notice-ok">OK</button>
    </div>
    <script src="/static/js/cookie-notice.js" integrity="sha256-JefnNU1ms64X4lDQibD4l8z4rVAi+15sb4hle0uE0yM=" crossorigin="anonymous" ></script>
</body>
</html>
